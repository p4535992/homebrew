name: Resolve 112 legacy JSON references

on:
  pull_request:
    branches:
      - update/renaming-images-2026
    paths:
      - .github/workflows/resolve-112-json-temp.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JSON repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update all 112 references
        run: |
          python - <<'PY'
          import json
          import re
          from collections import defaultdict
          from pathlib import Path
          from urllib.parse import unquote

          FOLDERS = {
              "Darklords&DomainsVol1",
              "ROTSSPGF",
              "ATBOH",
              "KGFD",
              "SEIISL",
              "AngryGolemGamesMonsterManual",
              "COMOrc",
              "COMItems",
          }
          URL_RE = re.compile(
              r"https://raw\.githubusercontent\.com/[^/]+/homebrew-img/[^/]+/img/([^/]+)/(.+?\.(?:jpg|jpeg|png))$",
              re.IGNORECASE,
          )

          def snake_name(value: str) -> str:
              value = value.replace("'", "").replace("’", "").replace("‘", "")
              value = re.sub(r"[()\[\]]", "", value)
              value = value.replace("-", "_").replace("/", "_").replace("\\", "_")
              value = re.sub(r"\s+", "_", value)
              value = re.sub(r"[^\w.]+", "_", value, flags=re.UNICODE)
              return re.sub(r"_+", "_", value).strip("_.")

          def infer_role(path):
              joined = ".".join(map(str, path)).lower()
              if "tokenurl" in joined or "tokenhref" in joined:
                  return "token"
              if ".cover." in f".{joined}." or joined.endswith("cover.url"):
                  return "cover"
              return "avatar"

          def nearest_name(stack, role, folder):
              if role == "cover" and folder == "ATBOH":
                  return "The Book of Hordes"
              for item in reversed(stack):
                  if not isinstance(item, dict):
                      continue
                  for key in ("name", "shortName", "title"):
                      value = item.get(key)
                      if isinstance(value, str) and value.strip():
                          return value.strip()
              raise RuntimeError("No JSON name found for image reference")

          occurrences_by_file = defaultdict(list)

          def walk(node, path, stack, json_file):
              if isinstance(node, dict):
                  next_stack = stack + [node]
                  for key, value in node.items():
                      walk(value, path + [key], next_stack, json_file)
                  return
              if isinstance(node, list):
                  for index, value in enumerate(node):
                      walk(value, path + [index], stack, json_file)
                  return
              if not isinstance(node, str):
                  return
              match = URL_RE.match(node)
              if not match:
                  return
              folder = match.group(1)
              if folder not in FOLDERS:
                  return
              role = infer_role(path)
              name = nearest_name(stack, role, folder)
              if role == "cover" and folder == "ATBOH":
                  target_name = "The_Book_of_Hordes_Cover.webp"
              else:
                  target_name = f"{snake_name(name)}_{role.capitalize()}.webp"
              target_path = f"img/{folder}/{target_name}"
              new_url = (
                  "https://raw.githubusercontent.com/"
                  f"TheGiddyLimit/homebrew-img/main/{target_path}"
              )
              occurrences_by_file[json_file].append({
                  "json_file": str(json_file),
                  "json_path": path,
                  "name": name,
                  "role": role,
                  "legacy_basename": unquote(match.group(2)),
                  "old_url": node,
                  "new_url": new_url,
                  "target": target_path,
              })

          for json_file in sorted(Path(".").rglob("*.json")):
              if "node_modules" in json_file.parts or ".git" in json_file.parts:
                  continue
              try:
                  data = json.loads(json_file.read_text(encoding="utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  continue
              walk(data, [], [], json_file)

          occurrences = [
              item
              for json_file in sorted(occurrences_by_file, key=str)
              for item in occurrences_by_file[json_file]
          ]
          sources = {item["old_url"] for item in occurrences}
          targets = {item["new_url"] for item in occurrences}
          if (
              len(occurrences) != 112
              or len(sources) != 73
              or len(targets) != 100
              or len(occurrences_by_file) != 8
          ):
              raise SystemExit(
                  f"Unexpected counts: occurrences={len(occurrences)}, "
                  f"sources={len(sources)}, targets={len(targets)}, "
                  f"json_files={len(occurrences_by_file)}"
              )

          modified_files = []
          for json_file, file_occurrences in sorted(
              occurrences_by_file.items(), key=lambda item: str(item[0])
          ):
              original = json_file.read_text(encoding="utf-8")
              cursor = 0
              parts = []
              for item in file_occurrences:
                  position = original.find(item["old_url"], cursor)
                  if position < 0:
                      raise SystemExit(
                          f"Could not locate {item['old_url']} in {json_file} after offset {cursor}"
                      )
                  parts.append(original[cursor:position])
                  parts.append(item["new_url"])
                  cursor = position + len(item["old_url"])
              parts.append(original[cursor:])
              updated = "".join(parts)
              json.loads(updated)
              json_file.write_text(updated, encoding="utf-8")
              modified_files.append(str(json_file))

          remaining = []
          for json_file in sorted(Path(".").rglob("*.json")):
              if "node_modules" in json_file.parts or ".git" in json_file.parts:
                  continue
              try:
                  data = json.loads(json_file.read_text(encoding="utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  continue

              def find_remaining(node, path):
                  if isinstance(node, dict):
                      for key, value in node.items():
                          find_remaining(value, path + [key])
                  elif isinstance(node, list):
                      for index, value in enumerate(node):
                          find_remaining(value, path + [index])
                  elif isinstance(node, str):
                      match = URL_RE.match(node)
                      if match and match.group(1) in FOLDERS:
                          remaining.append({
                              "json_file": str(json_file),
                              "json_path": path,
                              "url": node,
                          })

              find_remaining(data, [])

          if remaining:
              raise SystemExit(
                  "Legacy references remain:\n"
                  + json.dumps(remaining, ensure_ascii=False, indent=2)
              )

          report = {
              "occurrences_updated": len(occurrences),
              "legacy_sources_replaced": len(sources),
              "named_webp_targets": len(targets),
              "json_files_modified": modified_files,
              "remaining_legacy_references": len(remaining),
              "occurrences": occurrences,
          }
          Path("/tmp/resolve-112-json-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          lines = [
              "# Resolve 112 legacy JSON references",
              "",
              f"- References updated: **{len(occurrences)}**",
              f"- Legacy source URLs replaced: **{len(sources)}**",
              f"- Named WebP targets used: **{len(targets)}**",
              f"- JSON files modified: **{len(modified_files)}**",
              f"- Remaining matching legacy references: **{len(remaining)}**",
              "",
              "| JSON file | Object | Role | Legacy basename | Named WebP |",
              "|---|---|---|---|---|",
          ]
          for item in occurrences:
              lines.append(
                  f"| `{item['json_file']}` | {item['name'].replace('|', '\\|')} | "
                  f"`{item['role']}` | `{item['legacy_basename']}` | `{item['target']}` |"
              )
          Path("/tmp/resolve-112-json-report.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Remove temporary workflow
        run: git rm -f .github/workflows/resolve-112-json-temp.yml

      - name: Commit JSON corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve all 112 legacy image references"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload migration report
        uses: actions/upload-artifact@v4
        with:
          name: resolve-112-json-report
          path: |
            /tmp/resolve-112-json-report.json
            /tmp/resolve-112-json-report.md
          retention-days: 7
