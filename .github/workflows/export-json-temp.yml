name: Migrate remaining image references
on:
  pull_request:
    branches: [update/renaming-images-2026]
    paths: [.github/migration-export-trigger, .github/workflows/export-json-temp.yml]
permissions:
  contents: write
env:
  SOURCE_ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-6cbc-81f4-86a5-45ae20a549ee/raw?se=2026-08-01T17:25:01Z&sp=r&sv=2026-02-06&sr=b&scid=82ae1a1e-a475-518a-95ea-8fb8325fb643&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T04:51:35Z&ske=2026-08-02T04:51:35Z&sks=b&skv=2026-02-06&sig=HYSMrjg9%2B9BkxTY3qG8LBbVR8nv%2BfRcE4ZJA/n1GvEM%3D"
  INVENTORY_ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-7440-81f4-8b29-cd08f4d9e608/raw?se=2026-08-01T17:25:05Z&sp=r&sv=2026-02-06&sr=b&scid=a91f4ffd-9438-540e-abbb-5bbdf5e38a61&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T00:31:18Z&ske=2026-08-02T00:31:18Z&sks=b&skv=2026-02-06&sig=muxC9hBapKM5tqTyPVY2fcyW0Uu3NmPqPshRtk8z8ng%3D"
  MIGRATION_SCRIPT_ZLIB_B64: ""
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download migration inputs
        run: |
          curl --fail --location --retry 3 "$SOURCE_ARTIFACT_URL" -o /tmp/source.zip
          curl --fail --location --retry 3 "$INVENTORY_ARTIFACT_URL" -o /tmp/inventory.zip
          mkdir -p /tmp/source-artifact /tmp/source /tmp/inventory
          unzip -q /tmp/source.zip -d /tmp/source-artifact
          tar -xf /tmp/source-artifact/homebrew-img.tar -C /tmp/source
          unzip -q /tmp/inventory.zip -d /tmp/inventory
      - name: Update deterministic JSON references
        run: |
          python - <<'PY'
          import base64,os,zlib
          open('/tmp/migrate-json.py','wb').write(zlib.decompress(base64.b64decode(os.environ['MIGRATION_SCRIPT_ZLIB_B64'])))
          PY
          python /tmp/migrate-json.py
      - name: Commit JSON migration
        run: |
          rm -f .github/workflows/export-json-temp.yml .github/migration-export-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Update remaining deterministic image references"
          git push origin "HEAD:${{ github.head_ref }}"
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-json-migration-report
          path: |
            /tmp/migration-work/migration-report.json
            /tmp/migration-work/migration-ambiguous.json
            /tmp/migration-work/migration-changes.json
            /tmp/migration-work/remaining-imgur.tsv
            /tmp/migration-work/remaining-common-ids.tsv
          retention-days: 7
